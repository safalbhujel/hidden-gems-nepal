<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg-rhino" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF360C"/>
      <stop offset="50%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="80" fill="url(#bg-rhino)"/>
  <!-- Morning Terai Sun -->
  <circle cx="80" cy="65" r="38" fill="#FFF9C4" opacity="0.6"/>
  <!-- Elephant Grass Silhouettes -->
  <line x1="20" y1="160" x2="30" y2="110" stroke="#3E2723" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="35" y1="160" x2="42" y2="120" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="135" y1="160" x2="125" y2="110" stroke="#3E2723" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="145" y1="160" x2="140" y2="120" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Greater One-Horned Rhino (Gaida) Armored Head -->
  <path d="M 45,100 Q 55,60 85,68 Q 115,75 125,105 Q 115,135 80,135 Q 50,130 45,100 Z" fill="#546E7A"/>
  <!-- Prominent Single Horn -->
  <path d="M 115,82 Q 138,72 135,62 Q 120,72 110,84 Z" fill="#37474F"/>
  <!-- Armor Plate Folds (Signature of Indian/Nepal Rhino) -->
  <path d="M 65,72 Q 72,95 62,120" stroke="#37474F" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 85,74 Q 92,98 84,122" stroke="#37474F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Rhino Ears -->
  <polygon points="58,68 62,50 70,66" fill="#455A64"/>
  <polygon points="72,70 78,52 84,68" fill="#455A64"/>
  <!-- Eye -->
  <circle cx="95" cy="85" r="3.5" fill="#212121"/>
  <circle cx="94" cy="84" r="1" fill="#FFFFFF"/>
</svg>