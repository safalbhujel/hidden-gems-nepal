<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg-monk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="50%" stop-color="#7B1113"/>
      <stop offset="100%" stop-color="#D47A00"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="80" fill="url(#bg-monk)"/>
  <!-- Prayer Flags Strings across top -->
  <path d="M 10,25 Q 80,45 150,25" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="25,28 38,31 35,46 22,43" fill="#1976D2" opacity="0.85"/>
  <polygon points="45,33 58,36 55,51 42,48" fill="#FFFFFF" opacity="0.85"/>
  <polygon points="65,37 78,39 75,54 62,52" fill="#D32F2F" opacity="0.85"/>
  <polygon points="85,39 98,37 95,52 82,54" fill="#388E3C" opacity="0.85"/>
  <polygon points="105,36 118,33 115,48 102,51" fill="#FBC02D" opacity="0.85"/>
  <!-- Golden Stupa Spire Pinnacle -->
  <polygon points="80,45 74,68 86,68" fill="#FFD54F"/>
  <rect x="70" y="68" width="20" height="10" fill="#FFC107"/>
  <!-- The Wisdom Eyes of Buddha (Kathmandu Stupa) -->
  <!-- Left Eye -->
  <path d="M 52,90 Q 64,80 74,90 Q 64,95 52,90 Z" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>
  <circle cx="63" cy="88" r="4" fill="#212121"/>
  <circle cx="62" cy="87" r="1.5" fill="#FFFFFF"/>
  <path d="M 52,82 Q 62,75 74,83" stroke="#212121" stroke-width="2" fill="none"/>
  <!-- Right Eye -->
  <path d="M 86,90 Q 96,80 108,90 Q 96,95 86,90 Z" fill="#FFFFFF" stroke="#212121" stroke-width="2"/>
  <circle cx="97" cy="88" r="4" fill="#212121"/>
  <circle cx="96" cy="87" r="1.5" fill="#FFFFFF"/>
  <path d="M 86,83 Q 98,75 108,82" stroke="#212121" stroke-width="2" fill="none"/>
  <!-- Third eye dot (Urna) -->
  <circle cx="80" cy="78" r="3" fill="#D32F2F"/>
  <!-- Unity Nose Symbol (Nepali Number 1 'Ek' symbol representing oneness) -->
  <path d="M 77,93 Q 80,95 83,93 Q 84,102 78,106 Q 74,108 77,112 Q 83,115 84,110" stroke="#FFD54F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>