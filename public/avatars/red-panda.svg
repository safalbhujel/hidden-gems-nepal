<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg-panda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#053926"/>
      <stop offset="60%" stop-color="#145A32"/>
      <stop offset="100%" stop-color="#2ECC71"/>
    </linearGradient>
    <linearGradient id="red-fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="80" fill="url(#bg-panda)"/>
  <!-- Bamboo Leaves in background -->
  <path d="M 20,40 Q 40,25 60,35 Q 40,50 20,40 Z" fill="#27AE60" opacity="0.7"/>
  <path d="M 140,50 Q 120,30 100,45 Q 120,65 140,50 Z" fill="#2ECC71" opacity="0.6"/>
  <!-- Ears -->
  <polygon points="35,50 55,18 75,48" fill="#FFFFFF"/>
  <polygon points="45,45 55,24 68,45" fill="#D84315"/>
  <polygon points="85,48 105,18 125,50" fill="#FFFFFF"/>
  <polygon points="92,45 105,24 115,45" fill="#D84315"/>
  <!-- Head -->
  <ellipse cx="80" cy="85" rx="46" ry="40" fill="url(#red-fur)"/>
  <!-- White Eyebrow & Cheek Patches -->
  <ellipse cx="55" cy="80" rx="15" ry="12" fill="#FFFFFF"/>
  <ellipse cx="105" cy="80" rx="15" ry="12" fill="#FFFFFF"/>
  <ellipse cx="60" cy="62" rx="7" ry="5" fill="#FFFFFF"/>
  <ellipse cx="100" cy="62" rx="7" ry="5" fill="#FFFFFF"/>
  <!-- Snout & Nose -->
  <ellipse cx="80" cy="94" rx="18" ry="14" fill="#FFFFFF"/>
  <polygon points="74,88 86,88 80,94" fill="#212121"/>
  <path d="M 80,94 L 80,100 M 80,100 Q 75,103 70,100 M 80,100 Q 85,103 90,100" stroke="#212121" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="62" cy="76" r="6" fill="#3E2723"/>
  <circle cx="60" cy="74" r="2" fill="#FFFFFF"/>
  <circle cx="98" cy="76" r="6" fill="#3E2723"/>
  <circle cx="96" cy="74" r="2" fill="#FFFFFF"/>
  <!-- Dark eye tear marks -->
  <path d="M 66,80 Q 70,88 72,94" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 94,80 Q 90,88 88,94" stroke="#8D6E63" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>